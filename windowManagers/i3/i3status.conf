general {
    output_format = "i3bar"
    colors = true
    interval = 5
}

order += "ipv6"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"

wireless _first_ {
    format_up = "W: (%quality at %essid) %ip"
    format_down = "W: down"
}

ethernet _first_ {
    format_up = "E: %ip (%speed)"
    format_down = "E: down"
}

battery all {
    format = "BAT %percentage %remaining"
    last_full_capacity = true
}

ipv6 {
    format_up = "%ip"
    format_down = ""
}
